[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandparts"
version = "0.1.0"
description = "Split big-band chart PDFs into one clean, tagged file per voice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml"]

[project.scripts]
bandparts = "bandparts.cli:main"

[tool.setuptools]
packages = ["bandparts"]
