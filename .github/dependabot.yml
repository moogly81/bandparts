# Keep the toolchain current without watching it by hand.
#
# Grouped so a quiet week produces one pull request rather than five.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    # The workflow pins actions by commit; this keeps those pins current.
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      base-image:
        patterns: ["*"]
    commit-message:
      prefix: "docker"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
