# Actions are pinned to a commit rather than a tag: a tag can be moved to
# point at new code, and these run with the Docker Hub token in scope.
# Dependabot updates the pins, keeping the version comment in step.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Rebuild weekly: the image tracks Debian's tesseract and ocrmypdf, so a
  # published tag goes stale on security updates even when nothing here moves.
  schedule:
    - cron: "0 6 * * 1"

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/bandparts

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Command line entry points respond
        run: |
          bandparts --help
          musicxml-check --help

  # The pipeline is mostly external tools, so prove they are wired up
  # correctly rather than only that the Python imports.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ocrmypdf qpdf poppler-utils unpaper \
            libimage-exiftool-perl libxml2-utils \
            tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: pip install .
      - name: Split a generated two-voice chart
        run: |
          set -euo pipefail
          # Build a chart the same shape as a real one: a page per voice,
          # with the instrument named in the header where the tool looks.
          mkdir -p data/in/test
          python - <<'PY'
          from pathlib import Path
          import subprocess
          pages = []
          for voice in ("Trombone 1", "Trombone 2"):
              ps = Path(f"/tmp/{voice}.ps")
              ps.write_text(
                  "%!PS\n/Helvetica findfont 24 scalefont setfont\n"
                  f"72 700 moveto ({voice}) show\n"
                  "72 660 moveto (Test Chart) show\nshowpage\n"
              )
              pdf = ps.with_suffix(".pdf")
              subprocess.run(["ps2pdf", str(ps), str(pdf)], check=True)
              pages.append(str(pdf))
          subprocess.run(["qpdf", "--empty", "--pages", *pages, "--", "data/in/test/Test Chart.pdf"], check=True)
          PY
          # No arguments: this also checks the defaults still point at data/.
          bandparts
          ls -1 data/out/test/
          test -f "data/out/test/Test Chart - Trombone 1.pdf"
          test -f "data/out/test/Test Chart - Trombone 2.pdf"
          exiftool -s -Title "data/out/test/Test Chart - Trombone 1.pdf" | grep -q "Trombone 1"

  # The image is built by Nix from the same flake as the dev shell, so the
  # tools inside it are the ones contributors actually test with. Each
  # architecture is built on its own runner: Nix cross-compiles poorly, and
  # emulating a build of this size is far slower than a native runner.
  image:
    runs-on: ${{ matrix.runner }}
    needs: [test, pipeline]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the image
        run: nix build .#dockerImage --print-build-logs

      # streamLayeredImage produces a script that writes the tarball on
      # demand, so the image never touches the disk twice.
      - name: Load and smoke test
        run: |
          ./result | docker load
          docker run --rm bandparts:latest --help > /dev/null
          docker run --rm --entrypoint ocrmypdf bandparts:latest --version

      - name: Can we publish?
        id: publish
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.yes == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push this architecture
        if: steps.publish.outputs.yes == 'true'
        run: |
          docker tag bandparts:latest "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  # The per-architecture tags above are an implementation detail; this is what
  # gives moogly81/bandparts:latest a manifest list covering both.
  publish:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Can we publish?
        id: publish
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.yes == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Combine both architectures under each tag
        if: steps.publish.outputs.yes == 'true'
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create -t "$tag" \
              "$IMAGE:${{ github.sha }}-amd64" \
              "$IMAGE:${{ github.sha }}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Description
        if: steps.publish.outputs.yes == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ github.event.repository.description }}
