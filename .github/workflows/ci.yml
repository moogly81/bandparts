# Actions are pinned to a commit rather than a tag: a tag can be moved to
# point at new code, and these run with the Docker Hub token in scope.
# Dependabot updates the pins, keeping the version comment in step.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/bandparts
  GHCR: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  # Whether this commit can possibly change the image. Documentation cannot,
  # and rebuilding it for a typo costs four minutes to republish identical
  # bytes. Done with git rather than an action: one less thing to pin.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No usable base (first push, a new branch, a tag): assume it matters.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$|LICENSE$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Command line entry points respond
        run: |
          bandparts --help
          musicxml-check --help

  # The pipeline is mostly external tools, so prove they are wired up
  # correctly rather than only that the Python imports.
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ocrmypdf qpdf poppler-utils unpaper \
            libimage-exiftool-perl libxml2-utils \
            tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: pip install .
      - name: Split a generated two-voice chart
        run: |
          set -euo pipefail
          # Build a chart the same shape as a real one: a page per voice,
          # with the instrument named in the header where the tool looks.
          mkdir -p data/in/test
          python - <<'PY'
          from pathlib import Path
          import subprocess
          pages = []
          for voice in ("Trombone 1", "Trombone 2"):
              ps = Path(f"/tmp/{voice}.ps")
              ps.write_text(
                  "%!PS\n/Helvetica findfont 24 scalefont setfont\n"
                  f"72 700 moveto ({voice}) show\n"
                  "72 660 moveto (Test Chart) show\nshowpage\n"
              )
              pdf = ps.with_suffix(".pdf")
              subprocess.run(["ps2pdf", str(ps), str(pdf)], check=True)
              pages.append(str(pdf))
          subprocess.run(["qpdf", "--empty", "--pages", *pages, "--", "data/in/test/Test Chart.pdf"], check=True)
          PY
          # No arguments: this also checks the defaults still point at data/.
          bandparts
          ls -1 data/out/test/
          test -f "data/out/test/Test Chart - Trombone 1.pdf"
          test -f "data/out/test/Test Chart - Trombone 2.pdf"
          exiftool -s -Title "data/out/test/Test Chart - Trombone 1.pdf" | grep -q "Trombone 1"

  # The image is built by Nix from the same flake as the dev shell, so the
  # tools inside it are the ones contributors actually test with. Each
  # architecture is built on its own runner: Nix cross-compiles poorly, and
  # emulating a build of this size is far slower than a native runner.
  #
  # This does not wait for the tests. Building in parallel gets the answer
  # sooner, and nothing is published until publish has seen them pass.
  image:
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the image
        run: nix build .#dockerImage --print-build-logs

      # streamLayeredImage writes the tarball on demand, so the image is
      # produced once and read straight into the daemon.
      - name: Load
        run: ./result | docker load

      # A scan, not a text PDF: this exercises tesseract, ghostscript and the
      # split together, inside the image, which 'ocrmypdf --version' does not.
      # It does not cover every way the toolchain can be wrong - a tesseract
      # missing the orientation model passes this - but it catches OCR being
      # broken outright.
      - name: Split a scanned chart inside the image
        run: |
          set -euo pipefail
          mkdir -p smoke/in/testbook smoke/out
          # The image runs as uid 1000 and this runner is 1001, so the mount
          # has to be writable by both. Docker Desktop hides this by
          # remapping ownership; Linux does not.
          chmod -R a+rwX smoke

          # A page per voice, named where the tool looks, then flattened to
          # pixels so that the text can only be recovered by OCR.
          cat > smoke/chart.ps <<'PS'
          %!PS
          /Helvetica findfont 24 scalefont setfont
          72 700 moveto (Trombone 1) show
          72 660 moveto (Smoke Test) show
          showpage
          /Helvetica findfont 24 scalefont setfont
          72 700 moveto (Trombone 2) show
          72 660 moveto (Smoke Test) show
          showpage
          PS

          # pdfimage24 renders each page to pixels and wraps them in a PDF,
          # so what comes out has no text layer: a scan, in every way that
          # matters to the tool.
          docker run --rm -v "$PWD/smoke:/smoke" --entrypoint gs bandparts:latest \
            -sDEVICE=pdfimage24 -r150 -dNOPAUSE -dBATCH -q \
            -sOutputFile="/smoke/in/testbook/Smoke Test.pdf" /smoke/chart.ps

          docker run --rm -v "$PWD/smoke:/work/data" bandparts:latest

          ls -1 smoke/out/testbook/
          test -f "smoke/out/testbook/Smoke Test - Trombone 1.pdf"
          test -f "smoke/out/testbook/Smoke Test - Trombone 2.pdf"

      - name: Help and version still respond
        run: docker run --rm bandparts:latest --help > /dev/null

      # A fork has no Docker Hub token; GHCR always works, so publishing
      # degrades to one registry instead of failing.
      - name: Have we a Docker Hub token?
        id: hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.have == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push this architecture
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          for registry in "$GHCR" ${{ steps.hub.outputs.have == 'true' && '"$IMAGE"' || '' }}; do
            docker tag bandparts:latest "$registry:$SHA-$ARCH"
            docker push "$registry:$SHA-$ARCH"
          done
        env:
          SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}

  # The per-architecture tags above are an implementation detail; this is what
  # gives :latest and :0.1.0 a manifest list covering both. Only on a tag, and
  # only once the tests have passed.
  publish:
    runs-on: ubuntu-latest
    needs: [changes, test, pipeline, image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Have we a Docker Hub token?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.have == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR }}
            ${{ steps.hub.outputs.have == 'true' && env.IMAGE || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Each tag is joined from the per-architecture tags of its own
      # registry: ':latest' must not be assembled from another host's blobs.
      - name: Combine both architectures under each tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            registry="${tag%:*}"
            docker buildx imagetools create -t "$tag" \
              "$registry:$SHA-amd64" "$registry:$SHA-arm64"
          done <<< "$TAGS"

      # The per-architecture tags exist only so that this job can join them.
      # Left behind they double the tag list on a public page and imply they
      # are something anyone should pull.
      - name: Remove the staging tags
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          HAVE_HUB: ${{ steps.hub.outputs.have }}
        run: |
          set -euo pipefail

          if [ "$HAVE_HUB" = "true" ]; then
            jwt=$(curl -sS -X POST https://hub.docker.com/v2/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"$USERNAME\",\"password\":\"$TOKEN\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            for arch in amd64 arm64; do
              curl -sS -X DELETE -H "Authorization: JWT $jwt" \
                "https://hub.docker.com/v2/repositories/$IMAGE/tags/$SHA-$arch/" \
                -o /dev/null -w "docker hub %{http_code} $SHA-$arch\n"
            done
          fi

          # GHCR keeps them as untagged versions rather than deleting the
          # blobs, and the token may not be allowed to remove versions at
          # all, so a failure here is reported and ignored.
          for arch in amd64 arm64; do
            digest=$(curl -sS -H "Authorization: Bearer $(printf %s "$GH_TOKEN" | base64)" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -I "https://ghcr.io/v2/${{ github.repository }}/manifests/$SHA-$arch" \
              | tr -d '\r' | awk -F': ' '/[Dd]ocker-[Cc]ontent-[Dd]igest/ {print $2}' || true)
            if [ -n "$digest" ]; then
              curl -sS -X DELETE -H "Authorization: Bearer $(printf %s "$GH_TOKEN" | base64)" \
                "https://ghcr.io/v2/${{ github.repository }}/manifests/$digest" \
                -o /dev/null -w "ghcr %{http_code} $SHA-$arch\n" || true
            fi
          done

      - name: Description
        if: steps.hub.outputs.have == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ github.event.repository.description }}
